[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor-ti-prototipo"
version = "0.2.0"
description = "Monitoreo preventivo local y explicable para detectar degradación antes del reporte del usuario"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "psutil==7.2.2",
]

[project.optional-dependencies]
esp32 = ["pyserial==3.5"]
librehardwaremonitor = ["pythonnet>=3.0,<4"]

[project.scripts]
monitor-ti = "monitor_ti.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
monitor_ti = ["web/*.html"]
